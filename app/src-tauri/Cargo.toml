[package]
name = "text-po-chelovecheski"
version = "1.0.0"
description = "Текст по-человечески — редактор научного текста с гарантией неизменяемого"
authors = ["NLP-Core-Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "text_po_chelovecheski_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
